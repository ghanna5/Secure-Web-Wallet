<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
</head>
<body>
    <h1>Hey!!</h1>
    <p>Welcome, {{ username }} to the secret page!</p>

    <!-- Logout needs CSRF token because it's a POST -->
    <form action="/logout" method="post" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
